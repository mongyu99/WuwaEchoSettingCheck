limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JSON·JS·CSS를 압축해서 보냅니다. catalog JSON처럼 큰 응답의 전송량과 받는 시간이 크게 줄어듭니다.
    # gzip_proxied any: app(8080)에서 받아 넘기는 /api 응답도 압축합니다.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Docker 내부 DNS. nginx는 proxy_pass의 이름을 시작할 때 한 번만 IP로 바꾸고 계속 쓰기 때문에,
    # app 컨테이너가 재시작으로 새 IP를 받으면 nginx를 재시작할 때까지 502가 납니다.
    # 변수로 넘기면 요청 때마다 resolver로 이름을 확인하고, 결과는 10초만 캐시합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API와 로그인 요청은 같은 compose 그룹의 API 서버(app)로 넘깁니다.
    location ~ ^/(api|oauth2|login/oauth2)/ {
        limit_req zone=api burst=20 nodelay; # 순간 20개까지
        limit_req_status 429;

        set $app_upstream http://app:8080;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 점(.)으로 시작하는 경로(.env, .git, .aws ...)는 봇이 비밀값을 찾으려고 찌르는 곳이라 바로 403.
    # 정규식 location은 적힌 순서대로 검사하므로 이미지 규칙보다 먼저 둡니다(.git/x.png 같은 요청도 막힘).
    # .well-known은 인증서 발급·security.txt 같은 표준 용도라 열어 둡니다.
    location ~ /\.(?!well-known/) {
        default_type "text/plain; charset=utf-8";
        return 403 "여기에는 당신이 찾는건 없을거에요.\n";
    }

    # Vite 빌드 결과(JS·CSS). 파일 이름에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀌므로 1년 동안 캐시해도 안전합니다.
    # 없는 파일은 index.html로 넘기지 않고 404: 봇이 아무 주소나 찔렀을 때 HTML이 JS 주소로 캐시되는 것을 막습니다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ 이미지. 바꿀 때는 파일 이름을 바꾸는 규칙(3.6 → 3.7, {ID}.webp)이라 30일 캐시합니다.
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # index.html은 매번 새로 확인해서, 배포하면 바로 새 JS 파일 이름을 받게 합니다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
