limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# 누구에게나 같은 공개 API(게임 데이터·배너·픽업·이벤트·방송·패치노트) 응답을 nginx가 들고 있다가 그대로 내줍니다(사실상 정적 파일).
# 관리자 저장·콘텐츠 덮어쓰기 때만 바뀌어서, app(Spring)은 주소마다 1분에 한 번만 받으면 됩니다.
# 부하 테스트(nginx CPU 0.5): 캐시 없이는 catalog가 초당 190건에서 밀렸고, 캐시 후 초당 500건을 1ms 안에 응답.
proxy_cache_path /var/cache/nginx/public-api levels=1 keys_zone=public_api:1m max_size=20m inactive=10m use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 운영은 Cloudflare를 거쳐 들어오므로, 접속 IP가 사용자가 아니라 Cloudflare 서버 IP입니다.
    # 그대로 두면 초당 5회 제한이 Cloudflare 서버 단위로 걸려, 같은 서버를 탄 사용자들이 한꺼번에 429를 맞습니다.
    # Cloudflare 대역에서 온 요청만 CF-Connecting-IP(진짜 사용자 IP)로 바꿔 씁니다. 다른 곳에서 온 요청은 헤더를 무시합니다.
    # 대역 목록: https://www.cloudflare.com/ips/ (2026-11 기준. 바뀌면 여기도 갱신)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # JSON·JS·CSS를 압축해서 보냅니다. catalog JSON처럼 큰 응답의 전송량과 받는 시간이 크게 줄어듭니다.
    # gzip_proxied any: app(8080)에서 받아 넘기는 /api 응답도 압축합니다.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Docker 내부 DNS. nginx는 proxy_pass의 이름을 시작할 때 한 번만 IP로 바꾸고 계속 쓰기 때문에,
    # app 컨테이너가 재시작으로 새 IP를 받으면 nginx를 재시작할 때까지 502가 납니다.
    # 변수로 넘기면 요청 때마다 resolver로 이름을 확인하고, 결과는 10초만 캐시합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 공개 API: 위 캐시에서 내줍니다. 정규식 location은 적힌 순서대로 검사하므로 아래 일반 /api 규칙보다 먼저 둡니다.
    # 로그인한 사용자 데이터(/api/me, /api/state)는 여기에 넣지 않습니다(사람마다 다름).
    location ~ ^/api/(catalog|banners|pickups|events|broadcasts|event-notes/latest|patch-notes)$ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_cache public_api;
        proxy_cache_key $request_uri;       # 패치노트처럼 ?page= 가 붙는 주소는 쪽마다 따로 저장
        proxy_cache_valid 200 1m;           # 1분 동안 app에 다시 묻지 않음. 데이터를 바꾸면 최대 1분 뒤 반영
        proxy_cache_lock on;                # 캐시가 비었을 때 몰린 요청 중 하나만 app으로 보내고 나머지는 기다림
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504; # app이 죽어도 마지막 데이터로 응답
        proxy_cache_background_update on;   # 만료돼도 기다리지 않고 이전 데이터를 주면서 뒤에서 새로 받음
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;
        # Cloudflare(캐시 규칙을 켠 경우)와 브라우저도 1분 동안 이 응답을 다시 쓰게 합니다.
        # Spring Security가 붙이는 no-store 헤더를 지워야 아래 헤더 하나만 나갑니다(안 지우면 둘 다 나가서 Cloudflare가 캐시 안 함).
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=60";
        # app에 항상 압축본을 달라고 해서 압축된 채로 캐시합니다. 요청마다 다시 압축하지 않아 nginx CPU를 거의 안 씁니다.
        # 압축을 못 받는 드문 클라이언트에게만 nginx가 풀어서 줍니다.
        proxy_set_header Accept-Encoding gzip;
        gunzip on;

        set $app_upstream http://app:8080;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API와 로그인 요청은 같은 compose 그룹의 API 서버(app)로 넘깁니다.
    location ~ ^/(api|oauth2|login/oauth2)/ {
        limit_req zone=api burst=20 nodelay; # 순간 20개까지
        limit_req_status 429;

        set $app_upstream http://app:8080;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 점(.)으로 시작하는 경로(.env, .git, .aws ...)는 봇이 비밀값을 찾으려고 찌르는 곳이라 바로 403.
    # 정규식 location은 적힌 순서대로 검사하므로 이미지 규칙보다 먼저 둡니다(.git/x.png 같은 요청도 막힘).
    # .well-known은 인증서 발급·security.txt 같은 표준 용도라 열어 둡니다.
    location ~ /\.(?!well-known/) {
        default_type "text/plain; charset=utf-8";
        return 403 "여기에는 당신이 찾는건 없을거에요.\n";
    }

    # Vite 빌드 결과(JS·CSS). 파일 이름에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀌므로 1년 동안 캐시해도 안전합니다.
    # 없는 파일은 index.html로 넘기지 않고 404: 봇이 아무 주소나 찔렀을 때 HTML이 JS 주소로 캐시되는 것을 막습니다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ 이미지. 바꿀 때는 파일 이름을 바꾸는 규칙(3.6 → 3.7, {ID}.webp)이라 30일 캐시합니다.
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # index.html은 매번 새로 확인해서, 배포하면 바로 새 JS 파일 이름을 받게 합니다.
    # 사이트는 주소가 / 하나뿐이고(페이지 이동은 화면 안에서), 소셜 로그인만 /auth/callback 으로 돌아옵니다.
    # 그 외 없는 주소를 전부 index.html로 돌려주면 봇이 /client.ovpn, /grafana.ini 같은 비밀 파일을 찌를 때마다
    # 200 OK가 찍혀서 로그가 지저분해지므로, 그 두 곳만 index.html로 보내고 나머지 없는 파일은 404로 끝냅니다.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location /auth/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
