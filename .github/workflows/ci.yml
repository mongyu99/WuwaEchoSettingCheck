# push·PR마다 백엔드 단위 테스트와 프론트 테스트·빌드를 돌립니다.
# 통합 테스트(./gradlew integrationTest)는 실제 Postgres와 git에서 제외된 시드 데이터가 필요해 여기서는 돌리지 않습니다.
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # 의존성을 캐시해서 두 번째 실행부터 빨라집니다.
      - uses: gradle/actions/setup-gradle@v4
      # Windows에서 커밋해 실행 권한이 빠져 있어서 직접 붙입니다.
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      # 실패했을 때 어떤 테스트가 왜 깨졌는지 Actions 화면에서 내려받아 볼 수 있게 남깁니다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # sharp(이미지 변환 스크립트용) 같은 설치 스크립트는 테스트·빌드에 필요 없어서 건너뜁니다(Dockerfile과 동일).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  # 테스트가 모두 통과한 master push에서만 운영용 이미지를 만들어 GHCR에 올립니다.
  # 서버는 backend/deploy.sh(cron 10분)로 새 커밋의 이미지가 올라왔는지 확인하고 받아서 재시작합니다.
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            context: backend
          - name: web
            context: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest는 서버가 받는 태그, 커밋 해시 태그는 "이 커밋의 이미지가 다 올라왔는지" 확인용입니다.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/mongyu99/wuwaecho-${{ matrix.name }}:latest
            ghcr.io/mongyu99/wuwaecho-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
