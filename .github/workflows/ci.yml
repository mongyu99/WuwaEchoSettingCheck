# push·PR마다 백엔드 단위 테스트와 프론트 테스트·빌드를 돌립니다.
# 통합 테스트(./gradlew integrationTest)는 실제 Postgres와 git에서 제외된 시드 데이터가 필요해 여기서는 돌리지 않습니다.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # 의존성을 캐시해서 두 번째 실행부터 빨라집니다.
      - uses: gradle/actions/setup-gradle@v4
      # Windows에서 커밋해 실행 권한이 빠져 있어서 직접 붙입니다.
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      # 실패했을 때 어떤 테스트가 왜 깨졌는지 Actions 화면에서 내려받아 볼 수 있게 남깁니다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # sharp(이미지 변환 스크립트용) 같은 설치 스크립트는 테스트·빌드에 필요 없어서 건너뜁니다(Dockerfile과 동일).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
