<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo Setting Check</title>
    <script>
      // React가 마운트되기 전에 테마를 먼저 적용해서, 기본(다크) 색으로 한 프레임 그려졌다가
      // 저장된 테마로 넘어가는 깜빡임(+ 색 트랜지션 애니메이션까지 타는 것)을 막습니다.
      // src/utils/theme.js의 STORAGE_KEY와 반드시 같은 값을 써야 합니다.
      (function () {
        try {
          var theme = localStorage.getItem('wuwa-echo-check:theme') === 'light' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          // CSS 파일이 아직 안 불러와졌어도(느린 네트워크 등) 브라우저 기본 흰 배경이 보이지
          // 않도록, index.css의 --bg-void 기본값과 같은 색을 여기서도 즉시 인라인으로 칠합니다.
          document.documentElement.style.backgroundColor = theme === 'light' ? '#f4f5fa' : '#0b0e17'
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Loading CSS */
      .boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        color: #8891ab;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(232, 236, 247, 0.12);
        border-top-color: #6ee7f9;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text { margin: 0; font-size: 14px; }
      /* 서버가 늦을 때(Redis·DB 장애 등)만 보이도록 5초 뒤에 나타납니다. */
      .boot-slow { margin: 0; font-size: 13px; opacity: 0; animation: boot-show 0.4s ease 5s forwards; }
      [data-theme='light'] .boot-loading { color: #5b6178; }
      [data-theme='light'] .boot-spinner { border-color: rgba(26, 31, 46, 0.12); border-top-color: #0891a8; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-text">불러오는 중…</p>
        <p class="boot-slow">서버 응답이 늦어지고 있어요. 조금만 기다려 주세요.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
