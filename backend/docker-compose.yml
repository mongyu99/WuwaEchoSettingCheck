# Docker Desktop에서 이 프로젝트 컨테이너를 "wuwaecho" 그룹으로 묶어 다른 컨테이너와 구분합니다.
name: wuwaecho

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wuwaecho}
      POSTGRES_USER: ${DB_USER:?backend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?backend}
    ports:
      - '5432:5432'
    volumes:
      - wuwaecho-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  # 게임 데이터(catalog) 캐시. 캐시라 데이터 보존이 필요 없어 볼륨 없이 메모리에만 둡니다.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    # .env 값을 환경변수로 넘깁니다(이미지 안에는 .env가 들어가지 않음).
    env_file: .env
    environment:
      # 컨테이너 안에서 localhost는 자기 자신이라, DB·Redis는 서비스 이름으로 찾아갑니다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-wuwaecho}
      REDIS_HOST: redis
      # 부하 테스트에서 캐시 없는 상태와 비교할 때만 false로 띄웁니다: CATALOG_CACHE_ENABLED=false docker compose up -d app
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 사이트 화면. http://localhost 로 접속하면 되고, /api 요청은 nginx가 app으로 넘깁니다.
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - app
    restart: unless-stopped

volumes:
  wuwaecho-db:
