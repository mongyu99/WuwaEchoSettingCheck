# Docker Desktop에서 이 프로젝트 컨테이너를 "wuwaecho" 그룹으로 묶어 다른 컨테이너와 구분합니다.
name: wuwaecho

# 서버는 메모리 2GB·CPU 2코어라, 컨테이너마다 쓸 수 있는 양에 상한을 둡니다(합계 약 1.2GB, 나머지는 OS 몫).
# 하나가 메모리를 다 먹어서 서버 전체가 멈추는 대신, 넘친 컨테이너만 재시작됩니다(restart: unless-stopped).

# 밖으로 여는 포트는 web(80) 하나뿐입니다. postgres·redis·app은 compose 내부 네트워크에서
# 서비스 이름(postgres, redis, app)으로만 서로 찾아갑니다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wuwaecho}
      POSTGRES_USER: ${DB_USER:?backend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?backend}
    volumes:
      - wuwaecho-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped


  # 게임 데이터(catalog) 캐시. 캐시라 데이터 보존이 필요 없어 볼륨 없이 메모리에만 둡니다.
  redis:
    image: redis:7-alpine
    # maxmemory: 상한(64m)보다 조금 낮게 잡아, 넘치면 컨테이너가 죽는 대신 오래된 키부터 지웁니다.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '48mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped


  # 로컬은 --build로 직접 빌드하고, 서버는 CI가 GHCR에 올린 같은 이름의 이미지를 받아서 씁니다(deploy.sh).
  app:
    image: ghcr.io/mongyu99/wuwaecho-app:latest
    build: .
    # .env 값을 환경변수로 넘깁니다(이미지 안에는 .env가 들어가지 않음).
    env_file: .env
    environment:
      # 컨테이너 안에서 localhost는 자기 자신이라, DB·Redis는 서비스 이름으로 찾아갑니다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-wuwaecho}
      REDIS_HOST: redis
      # 부하 테스트에서 캐시 없는 상태와 비교할 때만 false로 띄웁니다: CATALOG_CACHE_ENABLED=false docker compose up -d app
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
      # Redis·DB가 모두 죽었을 때 읽는 백업 JSON. 볼륨에 둬서 컨테이너를 새로 만들어도 남습니다.
      CATALOG_FALLBACK_FILE: /app/data/catalog-fallback.json
      # JVM 힙을 컨테이너 메모리 상한(768m)의 70%로 맞춥니다. 나머지는 스레드·메타스페이스 등 JVM 자체가 씁니다.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      - wuwaecho-catalog:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.5
    restart: unless-stopped

  # 사이트 화면. http://localhost 로 접속하면 되고, /api 요청은 nginx가 app으로 넘깁니다.
  web:
    image: ghcr.io/mongyu99/wuwaecho-web:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '80:80'
    # 게임 공식 이미지는 git에 올리지 않고, 서버 폴더를 그대로 끼워서 내보냅니다.
    # 서버는 backend/.env의 CONTENT_IMAGES_DIR(=git 밖 폴더), 로컬은 기본값 ../public 을 씁니다.
    # 이미지 올리기: sh local-seed/dump-content.sh --apply (DB와 같이 덮어씀)
    volumes:
      - ${CONTENT_IMAGES_DIR:-../public}/banners:/usr/share/nginx/html/banners:ro
      - ${CONTENT_IMAGES_DIR:-../public}/characters:/usr/share/nginx/html/characters:ro
      - ${CONTENT_IMAGES_DIR:-../public}/echo-sets:/usr/share/nginx/html/echo-sets:ro
      - ${CONTENT_IMAGES_DIR:-../public}/events:/usr/share/nginx/html/events:ro
      - ${CONTENT_IMAGES_DIR:-../public}/main:/usr/share/nginx/html/main:ro
      - ${CONTENT_IMAGES_DIR:-../public}/main-echoes:/usr/share/nginx/html/main-echoes:ro
      - ${CONTENT_IMAGES_DIR:-../public}/weapons:/usr/share/nginx/html/weapons:ro
    depends_on:
      - app
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

volumes:
  wuwaecho-db:
  wuwaecho-catalog:
