server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wuwaecho}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  catalog:
    cache-enabled: ${CATALOG_CACHE_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
