server:
  port: 8080
  # JSON 응답을 app에서 압축해 보냅니다. nginx가 catalog를 압축된 채로 저장해 두고 그대로 내주므로,
  # 요청마다 nginx가 다시 압축하느라 CPU를 쓰지 않습니다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wuwaecho}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jdbc:
    template:
      query-timeout: 3s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jakarta.persistence.query.timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  catalog:
    cache-enabled: ${CATALOG_CACHE_ENABLED:true}
    fallback-file: ${CATALOG_FALLBACK_FILE:catalog-fallback.json}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
