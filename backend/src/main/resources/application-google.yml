# 구글 로그인을 켤 때만 쓰는 설정입니다. SPRING_PROFILES_ACTIVE=google 로 켜고,
# 이때만 GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 환경변수가 필요합니다.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
