# 개발 DB(wuwaecho)를 건드리지 않도록 같은 Postgres의 테스트 전용 DB를 씁니다.
# 최초 1회: docker compose exec postgres createdb -U wuwaecho wuwaecho_test
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wuwaecho_test

# 테스트에서는 서버 시작 시 catalog를 Redis에 미리 채우지 않습니다(Redis 없이도 테스트가 돌도록).
app:
  catalog:
    preload: false
